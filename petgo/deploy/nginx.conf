# /etc/nginx/sites-available/petgo
# Nginx termina TLS, entrega estáticos e encaminha ao socket Gunicorn (R10).
# Porta 3306 e socket Gunicorn nunca expostos externamente.

server {
    listen 80;
    server_name seu-dominio.com.br;

    # Redireciona todo HTTP para HTTPS (exceto desafio Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 6M;

    # Arquivos estáticos — sem passar pelo Python
    location /static/ {
        alias /opt/petgo/app/static/;
        expires 30d;
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /opt/petgo/app/static/favicon.ico;
        access_log off;
    }

    # Proxy para Gunicorn via socket Unix
    location / {
        proxy_pass http://unix:/run/petgo/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/petgo_access.log;
    error_log  /var/log/nginx/petgo_error.log;
}
